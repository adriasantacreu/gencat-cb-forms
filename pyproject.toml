[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gencat-cb-forms"
version = "1.0.0"
description = "Pipeline per transformar proves oficials de Competències Bàsiques i Diagnòstiques (Generalitat de Catalunya) en Google Forms autocorregibles."
readme = "README.md"
authors = [{ name = "Adrià Santacreu" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
gencat-cb-forms = "src.cli:main"
